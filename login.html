<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Login | nexPro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.prod.website-files.com/6974c3dfc9de89aed672a42c/css/fairmarkit26.webflow.shared.4c1cb15cc.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    :root {
      --bg-main: #F3F3F3;
      --bg-card: #FFFFFF;
      --text-primary: #1A1A1A;
      --text-secondary: #7A7A7A;
      --border-color: #D9D9D9;
      --accent-purple: #7600E6;
      --accent-purple-light: #AA63ED;
      --accent-purple-dark: #510A94;
      --accent-orange: #FF6400;
      --accent-yellow: #FFCF21;
      --accent-green: #00FF8C;
      --accent-red: #FF0E56;
      --accent-blue: #4700E0;
      --accent-lightblue: #00C6FF;
      --error-color: #FF0E56;
      --accent-current: var(--accent-purple);
      --accent-current-soft: rgba(118, 0, 230, 0.12);
      --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main) !important;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(118, 0, 230, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 255, 140, 0.05) 0%, transparent 40%) !important;
      color: var(--text-primary);
      min-height: 100vh;
      font-family: "Public Sans", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient aurora background layer */
    .aurora-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      will-change: transform;
      mix-blend-mode: multiply;
    }

    .aurora-blob.b1 {
      width: 620px;
      height: 620px;
      top: -200px;
      left: -160px;
      background: radial-gradient(circle, rgba(118, 0, 230, 0.25) 0%, transparent 70%);
      animation: driftA 22s ease-in-out infinite;
    }

    .aurora-blob.b2 {
      width: 560px;
      height: 560px;
      bottom: -220px;
      right: -140px;
      background: radial-gradient(circle, rgba(0, 255, 140, 0.22) 0%, transparent 70%);
      animation: driftB 27s ease-in-out infinite;
    }

    .aurora-blob.b3 {
      width: 440px;
      height: 440px;
      top: 38%;
      left: 50%;
      background: radial-gradient(circle, rgba(255, 100, 0, 0.14) 0%, transparent 70%);
      animation: driftC 32s ease-in-out infinite;
    }

    /* Floating glass shapes */
    .glass-shape {
      position: fixed;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(255,255,255,0.35));
      border: 1px solid rgba(0,0,0,0.06);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 0;
      pointer-events: none;
      box-shadow: 0 20px 40px rgba(31,38,135,0.08);
    }

    .glass-shape.gs1 {
      width: 130px; height: 130px;
      top: 14%; left: 8%;
      transform: perspective(800px) rotateX(35deg) rotateY(-20deg) rotateZ(12deg);
      animation: floatShape1 12s ease-in-out infinite;
      border-radius: 50%;
    }

    .glass-shape.gs2 {
      width: 90px; height: 90px;
      bottom: 16%; right: 10%;
      transform: perspective(800px) rotateX(-25deg) rotateY(25deg) rotateZ(-10deg);
      animation: floatShape2 15s ease-in-out infinite;
    }

    .glass-shape.gs3 {
      width: 60px; height: 60px;
      top: 20%; right: 18%;
      transform: perspective(800px) rotateX(20deg) rotateY(30deg);
      animation: floatShape3 10s ease-in-out infinite;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,255,140,0.25), rgba(255,255,255,0.4));
    }

    @keyframes floatShape1 {
      0%, 100% { transform: perspective(800px) rotateX(35deg) rotateY(-20deg) rotateZ(12deg) translateY(0px) translateX(0px); }
      50% { transform: perspective(800px) rotateX(20deg) rotateY(-35deg) rotateZ(20deg) translateY(-30px) translateX(15px); }
    }
    @keyframes floatShape2 {
      0%, 100% { transform: perspective(800px) rotateX(-25deg) rotateY(25deg) rotateZ(-10deg) translateY(0px); }
      50% { transform: perspective(800px) rotateX(-40deg) rotateY(10deg) rotateZ(-20deg) translateY(28px); }
    }
    @keyframes floatShape3 {
      0%, 100% { transform: perspective(800px) rotateX(20deg) rotateY(30deg) translateY(0px) scale(1); }
      50% { transform: perspective(800px) rotateX(35deg) rotateY(10deg) translateY(-18px) scale(1.15); }
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
      background-image:
        linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 0%, transparent 75%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 0%, transparent 75%);
    }

    @keyframes driftA {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(80px, 60px) scale(1.15); }
    }
    @keyframes driftB {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-70px, -50px) scale(1.18); }
    }
    @keyframes driftC {
      0%, 100% { transform: translate(-50%, 0) scale(1); }
      50% { transform: translate(-50%, -60px) scale(1.2); }
    }

    @keyframes cardFloat {
      0%, 100% { transform: rotateX(0deg) rotateY(0deg) translateY(0px); }
      25% { transform: rotateX(1.2deg) rotateY(-1.5deg) translateY(-5px); }
      50% { transform: rotateX(0deg) rotateY(0deg) translateY(-10px); }
      75% { transform: rotateX(-1.2deg) rotateY(1.5deg) translateY(-5px); }
    }

    @keyframes borderRotate {
      to { transform: rotate(360deg); }
    }

    @keyframes cardEntrance {
      0% { opacity: 0; transform: perspective(1600px) rotateX(18deg) translateY(60px) scale(0.92); }
      100% { opacity: 1; transform: perspective(1600px) rotateX(0deg) translateY(0) scale(1); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora-layer, .glass-shape, .card-shell {
        animation: none !important;
      }
      .card-shell { transition: none !important; }
    }

    /* Top Navbar */
    .navbar {
      background-color: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color) !important;
    }

    /* Container */
    .login-container {
      max-width: 1000px;
      margin: 120px auto 60px auto;
      padding: 0 24px;
      width: 100%;
      position: relative;
      z-index: 1;
      perspective: 1600px;
    }

    .card-shell {
      position: relative;
      border-radius: 24px;
      animation: cardEntrance 1s var(--ease-premium) both, cardFloat 8s ease-in-out 1s infinite;
      transition: transform 0.25s var(--ease-premium);
      transform-style: preserve-3d;
    }

    .message {
      font-size: 13.5px;
      line-height: 1.5;
      text-align: center;
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .message.error {
      background: rgba(255, 14, 86, 0.08);
      border: 1px solid rgba(255, 14, 86, 0.2);
      color: #C10046;
      display: block;
      animation: shake 0.45s var(--ease-premium);
    }

    .signup-invite {
      font-size: 13.5px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 24px;
      display: none;
      background: rgba(0, 0, 0, 0.015);
      border: 1px dashed var(--border-color);
      padding: 16px;
      border-radius: 10px;
      animation: fadeInUp 0.4s var(--ease-premium);
    }

    .signup-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 6px;
      display: block;
      width: 100%;
      text-align: center;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 30px;
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .back-home:hover {
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .signup-link-container {
      text-align: center;
      margin-top: 18px;
      font-size: 13.5px;
      color: var(--text-secondary);
    }
    .signup-link-container a {
      color: var(--accent-purple);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .signup-link-container a:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <!-- Ambient premium background -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <div class="aurora-layer" aria-hidden="true">
    <div class="aurora-blob b1"></div>
    <div class="aurora-blob b2"></div>
    <div class="aurora-blob b3"></div>
  </div>
  <div class="glass-shape gs1" aria-hidden="true"></div>
  <div class="glass-shape gs2" aria-hidden="true"></div>
  <div class="glass-shape gs3" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- Shared Top Navbar matching index.html -->
  <div class="navbar-div">
    <div data-collapse="medium" data-animation="default" data-duration="650" role="banner" class="navbar w-nav">
      <div class="container nav">
        <a href="index.html" class="brand w-nav-brand">
          <div class="logo w-embed" style="display:flex; align-items:center;">
            <svg width="150" height="40" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg">
              <text x="10" y="55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Public Sans', sans-serif" font-weight="900" font-size="56px" fill="#1A1A1A" letter-spacing="-2px">
                nex<tspan fill="#00A370">Pro</tspan>
              </text>
            </svg>
          </div>
        </a>
        <nav role="navigation" class="nav-menu w-nav-menu">
          <div class="nav-scroll-wrap">
            <div class="nav-links-wrap" style="display: flex; align-items: center; justify-content: flex-end; width: 100%;">
              <a href="platformOverview.html" class="navlink w-inline-block" style="color: #1A1A1A; margin-right: 20px;"><div class="button-txt">Platform</div></a>
              <a href="ourStory.html" class="navlink w-inline-block" style="color: #1A1A1A; margin-right: 20px;"><div class="button-txt">About</div></a>
              <a href="index.html" class="navlink w-inline-block" style="color: #1A1A1A; margin-right: 20px;"><div class="button-txt">Home</div></a>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </div>

  <div class="login-container">
    <div class="card-shell" id="card-shell">
      <div class="np-split-layout">
        <!-- Left Editorial Dark Panel -->
        <div class="np-editorial-side">
          <div class="np-editorial-glow"></div>
          <div class="np-editorial-header">
            <div class="np-editorial-logo">nex<span>Pro</span></div>
          </div>
          <div class="np-editorial-quote-wrap">
            <blockquote class="np-editorial-quote" id="editorial-quote">
              "Source smarter with AI-powered procurement."
            </blockquote>
          </div>
          <div class="np-editorial-footer">
            NEXPRO OS &copy; 2026
          </div>
        </div>

        <!-- Right Authentication Form -->
        <div class="np-auth-side">
          <div class="np-auth-header">
            <h2 class="np-auth-title">Welcome to nexPro</h2>
            <p class="np-auth-subtitle" id="auth-subtitle">Source smarter with AI-powered procurement.</p>
          </div>

          <!-- Sliding Portal Switcher -->
          <div class="np-portal-switch" id="portal-switch">
            <div class="np-portal-thumb" id="portal-thumb"></div>
            <button type="button" class="np-portal-btn active" data-role="buyer" onclick="switchTab('buyer')">Buyer</button>
            <button type="button" class="np-portal-btn" data-role="vendor" onclick="switchTab('vendor')">Vendor</button>
          </div>

          <!-- Auth Form -->
          <form id="login-form" onsubmit="handleAuthSubmit(event)">
            <div class="np-auth-fields-wrapper">
              <!-- Buyer Fields -->
              <div id="buyer-fields" class="np-auth-fields active">
                <div class="np-form-group">
                  <label for="buyer-username">Work Email</label>
                  <input type="text" id="buyer-username" class="np-field" required placeholder="buyer@nexpro.com" autocomplete="username"/>
                </div>
                <div class="np-form-group" style="margin-bottom: 24px;">
                  <label for="buyer-password">Password</label>
                  <input type="password" id="buyer-password" class="np-field" required placeholder="••••••••" autocomplete="current-password"/>
                </div>
              </div>

              <!-- Vendor Fields -->
              <div id="vendor-fields" class="np-auth-fields">
                <div class="np-form-group">
                  <label for="vendor-username">Work Email</label>
                  <input type="text" id="vendor-username" class="np-field" placeholder="vendor@nexpro.com" autocomplete="username"/>
                </div>
                <div class="np-form-group">
                  <label for="vendor-password">Password</label>
                  <input type="password" id="vendor-password" class="np-field" placeholder="••••••••" autocomplete="current-password"/>
                </div>
                <div class="np-form-group" style="margin-bottom: 24px;">
                  <label for="vendor-business-id">Business ID</label>
                  <input type="text" id="vendor-business-id" class="np-field" placeholder="e.g. GST-12345" />
                </div>
              </div>
            </div>

            <button type="submit" id="submit-btn" class="np-btn np-btn-dark">
              <span class="np-spin" aria-hidden="true"></span>
              <span class="np-btn-label">Login as Buyer</span>
            </button>
          </form>

          <div id="signup-link-wrapper" class="signup-link-container">
            Don't have an account? <a onclick="handleSignup()">Sign Up</a>
          </div>

          <div id="msg-box" class="message"></div>

          <div id="signup-box" class="signup-invite">
            <div id="signup-text">Account not found. Click below to sign up.</div>
            <button class="signup-btn" onclick="handleSignup()">Create Account</button>
          </div>

          <a href="index.html" class="back-home">← Back to Marketing Site</a>
        </div>
      </div>
    </div>
  </div>

  <script src="state.js"></script>
  <script src="auth.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let activeRole = 'buyer';

    const quotes = {
      buyer: '"Source smarter with AI-powered procurement."',
      vendor: '"Win more business with AI-matched RFQs."'
    };

    const subtitles = {
      buyer: "Source smarter with AI-powered procurement.",
      vendor: "Win more business with AI-matched RFQs."
    };

    function moveTabPill(role) {
      const switchEl = document.getElementById('portal-switch');
      const thumb = document.getElementById('portal-thumb');
      const target = switchEl.querySelector(`.np-portal-btn[data-role="${role}"]`);
      if (!thumb || !target) return;
      const index = Array.from(switchEl.querySelectorAll('.np-portal-btn')).indexOf(target);
      thumb.style.transform = `translateX(${index * 100}%)`;
    }

    function switchTab(role) {
      activeRole = role;
      
      // Update portal switcher buttons
      document.querySelectorAll('.np-portal-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`.np-portal-btn[data-role="${role}"]`).classList.add('active');
      moveTabPill(role);

      // Quote swap animation
      const quoteEl = document.getElementById('editorial-quote');
      if (quoteEl) {
        quoteEl.style.opacity = 0;
        quoteEl.style.transform = 'translateY(-10px)';
        setTimeout(() => {
          quoteEl.innerText = quotes[role];
          quoteEl.style.opacity = 1;
          quoteEl.style.transform = 'translateY(0)';
        }, 150);
      }

      // Title/subtitle text swap
      const subtitleEl = document.getElementById('auth-subtitle');
      if (subtitleEl) {
        subtitleEl.innerText = subtitles[role];
      }

      // Fields crossfade
      const buyerFields = document.getElementById('buyer-fields');
      const vendorFields = document.getElementById('vendor-fields');

      if (role === 'buyer') {
        vendorFields.classList.remove('active');
        setTimeout(() => {
          buyerFields.classList.add('active');
        }, 150);

        document.getElementById('buyer-username').required = true;
        document.getElementById('buyer-password').required = true;
        document.getElementById('vendor-username').required = false;
        document.getElementById('vendor-password').required = false;
        document.getElementById('vendor-business-id').required = false;
      } else {
        buyerFields.classList.remove('active');
        setTimeout(() => {
          vendorFields.classList.add('active');
        }, 150);

        document.getElementById('buyer-username').required = false;
        document.getElementById('buyer-password').required = false;
        document.getElementById('vendor-username').required = true;
        document.getElementById('vendor-password').required = true;
        document.getElementById('vendor-business-id').required = true;
      }

      // Button tag label
      const btn = document.getElementById('submit-btn');
      btn.querySelector('.np-btn-label').innerText = `Login as ${role.charAt(0).toUpperCase() + role.slice(1)}`;

      hideMessage();
    }

    function showMessage(text, isError = true) {
      const msgBox = document.getElementById('msg-box');
      msgBox.innerText = text;
      msgBox.className = `message ${isError ? 'error' : ''}`;
      msgBox.style.display = 'block';
    }

    function hideMessage() {
      document.getElementById('msg-box').style.display = 'none';
      document.getElementById('signup-box').style.display = 'none';
    }

    function setButtonLoading(isLoading) {
      const btn = document.getElementById('submit-btn');
      btn.classList.toggle('np-loading', isLoading);
      btn.disabled = isLoading;
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      hideMessage();

      let email, pass;
      if (activeRole === 'buyer') {
        email = document.getElementById('buyer-username').value.trim();
        pass = document.getElementById('buyer-password').value;
      } else {
        email = document.getElementById('vendor-username').value.trim();
        pass = document.getElementById('vendor-password').value;
        const bizId = document.getElementById('vendor-business-id').value.trim();
        if (!bizId) {
          showMessage("Business ID is required for Vendor login.");
          return;
        }
      }

      // Allow admin account to login under buyer tab
      const user = window.appState.users.find(u => 
        u.email.toLowerCase() === email.toLowerCase() && 
        (u.role === activeRole || (activeRole === 'buyer' && u.role === 'admin'))
      );

      if (!user) {
        showMessage("Entered account does not exist.");
        const signupBox = document.getElementById('signup-box');
        if (signupBox) {
          const signupText = document.getElementById('signup-text');
          signupText.innerText = `Account not found. Recommend creating a new account to access the ${activeRole.charAt(0).toUpperCase() + activeRole.slice(1)} features.`;
          signupBox.style.display = 'block';
        }
        return;
      }

      if (user.password !== pass) {
        showMessage("Incorrect password. Please try again.");
        return;
      }

      setButtonLoading(true);
      
      // Update local storage role
      if (user.role === 'admin') {
        setNexproRole('buyer');
      } else {
        setNexproRole(activeRole);
      }
      
      setCurrentUser(user);

      // Route directly to generate-rfq.html workspace dashboard bypassing any prompt form
      setTimeout(() => {
        window.location.href = 'generate-rfq.html';
      }, 600);
    }

    function handleSignup() {
      let email = "";
      let pass = "";
      if (activeRole === 'buyer') {
        email = document.getElementById('buyer-username').value.trim();
        pass = document.getElementById('buyer-password').value;
      } else {
        email = document.getElementById('vendor-username').value.trim();
        pass = document.getElementById('vendor-password').value;
      }

      let url = `signup.html?role=${encodeURIComponent(activeRole)}`;
      if (email) url += `&email=${encodeURIComponent(email)}`;
      if (pass) url += `&password=${encodeURIComponent(pass)}`;
      window.location.href = url;
    }

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    document.addEventListener('DOMContentLoaded', () => {
      moveTabPill(activeRole);

      if (prefersReducedMotion) return;

      const cardShell = document.getElementById('card-shell');
      const container = document.querySelector('.login-container');

      container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        cardShell.style.transform = `perspective(1600px) rotateX(${(-y * 10).toFixed(2)}deg) rotateY(${(x * 10).toFixed(2)}deg) translateY(-4px)`;
      });

      container.addEventListener('mouseleave', () => {
        cardShell.style.transform = 'perspective(1600px) rotateX(0deg) rotateY(0deg)';
      });
    });

    window.addEventListener('resize', () => moveTabPill(activeRole));

    // Particle field
    (function initParticles() {
      const canvas = document.getElementById('particles-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h, particles;
      let mouseX = 0, mouseY = 0;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        const count = Math.min(110, Math.floor((w * h) / 14000));
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.6 + 0.4,
          baseAlpha: Math.random() * 0.5 + 0.2,
          twinkleSpeed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2,
          depth: Math.random() * 0.6 + 0.2
        }));
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          const alpha = p.baseAlpha * (0.6 + 0.4 * Math.sin(t * p.twinkleSpeed + p.phase));
          const offsetX = (mouseX - w / 2) * p.depth * 0.02;
          const offsetY = (mouseY - h / 2) * p.depth * 0.02;
          ctx.beginPath();
          ctx.arc(p.x + offsetX, p.y + offsetY, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(118, 0, 230, ${alpha * 0.6})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      resize();
      if (!prefersReducedMotion) {
        requestAnimationFrame(draw);
      } else {
        draw(0);
      }
    })();
  </script>
</body>
</html>
