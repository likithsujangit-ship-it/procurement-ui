<script>
  let state = {
    templates: [],
    suppliers: [],
    submittedResponses: [],
    applications: [],
    invoices: [],
    currentUser: null
  };

  let currentView = "vendor-dashboard";
  let selectedRfqId = null;

  // Filter states
  let invitedFilters = { search: "", status: "all" };
  let bidsFilters = { status: "all" };

  // Speech to Text Helper
  const SpeechToText = {
    attach(inputElement) {
      if (!inputElement) return;
      const parent = inputElement.parentNode;
      if (parent.querySelector('.stt-mic-btn')) return;
      
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "stt-mic-btn";
      btn.title = "Use voice input";
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.42 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
        </svg>
      `;
      parent.appendChild(btn);

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        btn.style.display = "none";
        return;
      }

      const rec = new SpeechRec();
      rec.continuous = false;
      rec.interimResults = false;
      rec.lang = 'en-US';

      rec.onstart = () => {
        btn.classList.add("stt-listening");
        showToast("Voice input listening...", "success");
      };

      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        if (text) {
          // Parse number if the input field expects it
          if (inputElement.type === "number") {
            const numVal = parseFloat(text.replace(/[^0-9.]/g, ''));
            if (!isNaN(numVal)) {
              inputElement.value = numVal;
            } else {
              showToast("Could not recognize a numeric value.", "error");
            }
          } else {
            inputElement.value = text;
          }
          // Trigger change events
          inputElement.dispatchEvent(new Event('input', { bubbles: true }));
          inputElement.dispatchEvent(new Event('change', { bubbles: true }));
        }
      };

      rec.onend = () => {
        btn.classList.remove("stt-listening");
      };

      rec.onerror = () => {
        btn.classList.remove("stt-listening");
        showToast("Voice recognition failed.", "error");
      };

      btn.onclick = () => {
        if (btn.classList.contains("stt-listening")) {
          rec.stop();
        } else {
          rec.start();
        }
      };
    }
  };

  // State Management Sync wrapper
  function loadState() {
    if (window.appState) {
      state = window.appState;
    }
    // Ensure nested properties exist
    if (!state.applications) state.applications = [];
    if (!state.invoices) state.invoices = [];
  }

  function saveState() {
    if (window.saveGlobalState) {
      window.saveGlobalState();
    } else {
      localStorage.setItem("nexpro_global_state", JSON.stringify(state));
    }
  }

  // Toast notification alerts
  function showToast(message, type = "success") {
    const toast = document.getElementById("toast-notification");
    if (!toast) return;
    toast.className = `toast-notif ${type}`;
    toast.innerText = message;
    toast.classList.add("active");
    setTimeout(() => {
      toast.classList.remove("active");
    }, 4000);
  }

  // Success modal overlay helpers
  function showSuccessOverlay(title, desc) {
    document.getElementById("success-modal-title").innerText = title;
    document.getElementById("success-modal-desc").innerText = desc;
    document.getElementById("success-overlay").classList.add("active");
  }

  function closeSuccessOverlay() {
    document.getElementById("success-overlay").classList.remove("active");
    navigateTo("my-bids");
  }

  // Modal overlays click outside dismissal handler
  function handleOverlayClick(e, modalId) {
    if (e.target.id === modalId) {
      document.getElementById(modalId).classList.remove("is-active");
    }
  }

  // HTML sanitization helper
  function escapeHTML(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Route router controller
  function navigateTo(view, rfqId = null) {
    currentView = view;
    selectedRfqId = rfqId;
    window.location.hash = `#${view}` + (rfqId ? `?rfqId=${rfqId}` : '');
    render();
  }

  function handleHashRoute() {
    const hash = window.location.hash || '#vendor-dashboard';
    const parts = hash.substring(1).split('?');
    currentView = parts[0];
    selectedRfqId = null;
    if (parts[1]) {
      const params = new URLSearchParams(parts[1]);
      selectedRfqId = params.get('rfqId');
    }
    render();
  }

  function render() {
    loadState();
    const user = getCurrentUser();
    const vendorRecord = getVendorSupplierRecord(user);

    renderBreadcrumbs(user, vendorRecord);
    renderHeader(user, vendorRecord);

    const workspace = document.getElementById("workspace-view");
    workspace.innerHTML = "";

    // Global vendor record validation check
    if (!vendorRecord && currentView !== "vendor-profile") {
      renderOnboardingNotice(workspace);
      return;
    }

    switch (currentView) {
      case "vendor-dashboard":
        renderDashboard(workspace, user, vendorRecord);
        break;
      case "invited-rfqs":
        renderInvitedRfqs(workspace, user, vendorRecord);
        break;
      case "submit-bid":
        renderSubmitBid(workspace, user, vendorRecord, selectedRfqId);
        break;
      case "my-bids":
        renderMyBids(workspace, user, vendorRecord);
        break;
      case "my-orders":
        renderMyOrders(workspace, user, vendorRecord);
        break;
      case "my-invoices":
        renderMyInvoices(workspace, user, vendorRecord);
        break;
      case "vendor-profile":
        renderVendorProfile(workspace, user, vendorRecord);
        break;
      default:
        renderDashboard(workspace, user, vendorRecord);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderBreadcrumbs(user, vendorRecord) {
    const container = document.getElementById("breadcrumb");
    container.innerHTML = "";
    if (currentView === "vendor-dashboard") {
      container.innerHTML = "<span>Portal Dashboard</span>";
    } else if (currentView === "invited-rfqs") {
      container.innerHTML = `<a onclick="navigateTo('vendor-dashboard')">Dashboard</a> <span class="breadcrumb-separator">/</span> <span>Invited Opportunities</span>`;
    } else if (currentView === "submit-bid") {
      container.innerHTML = `<a onclick="navigateTo('vendor-dashboard')">Dashboard</a> <span class="breadcrumb-separator">/</span> <a onclick="navigateTo('invited-rfqs')">Opportunities</a> <span class="breadcrumb-separator">/</span> <span>Submit Quote</span>`;
    } else if (currentView === "my-bids") {
      container.innerHTML = `<a onclick="navigateTo('vendor-dashboard')">Dashboard</a> <span class="breadcrumb-separator">/</span> <span>My Quotations</span>`;
    } else if (currentView === "my-orders") {
      container.innerHTML = `<a onclick="navigateTo('vendor-dashboard')">Dashboard</a> <span class="breadcrumb-separator">/</span> <span>Awarded Orders</span>`;
    } else if (currentView === "my-invoices") {
      container.innerHTML = `<a onclick="navigateTo('vendor-dashboard')">Dashboard</a> <span class="breadcrumb-separator">/</span> <span>Invoices &amp; Payments</span>`;
    } else if (currentView === "vendor-profile") {
      container.innerHTML = `<a onclick="navigateTo('vendor-dashboard')">Dashboard</a> <span class="breadcrumb-separator">/</span> <span>Company Profile</span>`;
    }
  }

  function renderHeader(user, vendorRecord) {
    const titleEl = document.getElementById("app-title");
    const actionsEl = document.getElementById("header-actions");
    actionsEl.innerHTML = "";

    if (currentView === "vendor-dashboard") {
      titleEl.innerText = "Dashboard";
      actionsEl.innerHTML = `<button class="primary-btn" onclick="navigateTo('invited-rfqs')">View Opportunities</button>`;
    } else if (currentView === "invited-rfqs") {
      titleEl.innerText = "Invited RFQs";
    } else if (currentView === "submit-bid") {
      titleEl.innerText = "Compile Proposal";
    } else if (currentView === "my-bids") {
      titleEl.innerText = "Submitted Bids";
    } else if (currentView === "my-orders") {
      titleEl.innerText = "Awarded Purchase Orders";
    } else if (currentView === "my-invoices") {
      titleEl.innerText = "Invoices Tracker";
    } else if (currentView === "vendor-profile") {
      titleEl.innerText = "Profile Configuration";
    }
  }

  function renderOnboardingNotice(container) {
    container.innerHTML = `
      <div class="glass-card" style="text-align: center; padding: 48px;">
        <h2 style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 24px; margin-bottom: 12px;">Supplier Account Not Found</h2>
        <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 24px auto;">
          Your user account is not linked to any active supplier business records. Let's create your company profile to register your credentials on the platform.
        </p>
        <button class="primary-btn" onclick="navigateTo('vendor-profile')">Establish Company Profile</button>
      </div>
    `;
  }

  // VIEW 1: VENDOR PORTAL DASHBOARD
  function renderDashboard(container, user, vendorRecord) {
    if (!vendorRecord) {
      container.innerHTML = `
        <div class="glass-card" style="padding:40px; text-align:center;">
          <h3 style="margin-bottom:12px; font-weight:800; font-family:'Outfit';">Account Unlinked</h3>
          <p style="color:var(--text-secondary); margin-bottom:20px;">Your account isn't linked to a company profile yet. Contact your administrator.</p>
        </div>
      `;
      return;
    }

    // 1. Calculate stats counts
    // Count of invited RFQs where status is PENDING SUPPLIER and vendor is in supplierIds and hasn't already submitted a bid
    const invitedRfqs = state.submittedResponses.filter(r => 
      r.hasProcurement && (r.supplierIds || []).includes(vendorRecord.id)
    );
    const pendingInvitesCount = invitedRfqs.filter(r => 
      r.procurementStatus === "PENDING SUPPLIER" && 
      !state.applications.some(a => a.rfqId === r.id && a.vendorId === vendorRecord.id)
    ).length;

    // Count of pending applications
    const pendingBidsCount = state.applications.filter(a => a.vendorId === vendorRecord.id && a.status === "PENDING").length;

    // Count of active orders
    const activeOrdersCount = state.applications.filter(a => a.vendorId === vendorRecord.id && a.status === "ACCEPTED").length;

    // Count of unpaid invoices
    const unpaidInvoicesCount = state.invoices.filter(i => i.vendorId === vendorRecord.id && i.status !== "PAID").length;

    // 2. Aggregate Recent Activity Feed (vendor scope only, max 8 items)
    const rawActivities = [];
    
    // Bids submitted & Orders status details
    state.applications.filter(a => a.vendorId === vendorRecord.id).forEach(app => {
      rawActivities.push({
        text: `Bid submitted for <strong>${escapeHTML(app.rfqTitle)}</strong> — <strong>$${Number(app.price).toLocaleString()}</strong>`,
        date: new Date(app.date)
      });
      if (app.status === "ACCEPTED") {
        const deliveryStatus = app.deliveryStatus || "Processing";
        rawActivities.push({
          text: `Order status updated to <strong>${escapeHTML(deliveryStatus)}</strong> for <strong>${escapeHTML(app.rfqTitle)}</strong>`,
          date: new Date(app.date) // Approximated status date
        });
      }
    });

    // Invoices details
    state.invoices.filter(i => i.vendorId === vendorRecord.id).forEach(inv => {
      rawActivities.push({
        text: `Invoice <strong>#${escapeHTML(inv.id)}</strong> submitted for <strong>$${Number(inv.amount).toLocaleString()}</strong>`,
        date: new Date(inv.submittedAt)
      });
    });

    // Sort by date desc
    rawActivities.sort((a, b) => b.date - a.date);
    const topActivities = rawActivities.slice(0, 8);

    let activityListHTML = topActivities.map(act => {
      const relTime = getRelativeTime(act.date);
      return `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(0,0,0,0.03);">
          <span style="font-size:13.5px; color:var(--text-primary);">${act.text}</span>
          <span style="font-size:11px; font-weight:600; color:var(--text-secondary);">${relTime}</span>
        </div>
      `;
    }).join("");

    if (topActivities.length === 0) {
      activityListHTML = `
        <div class="empty-state" style="padding:20px 0;">
          <div class="empty-state-title">No activity yet</div>
          <div class="empty-state-desc">Check Invited RFQs to get started.</div>
          <button class="primary-btn" onclick="navigateTo('invited-rfqs')" style="padding:6px 12px; font-size:12px;">Go to Invitations</button>
        </div>
      `;
    }

    container.innerHTML = `
      <div class="glass-card" style="margin-bottom: 28px;">
        <h2 style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 6px;">Welcome, ${escapeHTML(vendorRecord.contactPerson || user.email)}!</h2>
        <p style="color:var(--text-secondary); font-size:13.5px; margin:0;">Company Context: <strong>${escapeHTML(vendorRecord.name)}</strong></p>
      </div>

      <!-- 4 Stat Cards Row -->
      <div class="dashboard-grid">
        <div class="glass-card stat-card" style="border-left: 4px solid var(--accent-yellow); margin-bottom: 0;" onclick="navigateTo('invited-rfqs')">
          <div class="stat-title">Invited RFQs</div>
          <div class="stat-value">${pendingInvitesCount}</div>
        </div>
        <div class="glass-card stat-card" style="border-left: 4px solid var(--accent-purple); margin-bottom: 0;" onclick="navigateTo('my-bids')">
          <div class="stat-title">Pending Bids</div>
          <div class="stat-value">${pendingBidsCount}</div>
        </div>
        <div class="glass-card stat-card" style="border-left: 4px solid var(--accent-green); margin-bottom: 0;" onclick="navigateTo('my-orders')">
          <div class="stat-title">Active Orders</div>
          <div class="stat-value">${activeOrdersCount}</div>
        </div>
        <div class="glass-card stat-card" style="border-left: 4px solid var(--accent-red); margin-bottom: 0;" onclick="navigateTo('my-invoices')">
          <div class="stat-title">Unpaid Invoices</div>
          <div class="stat-value">${unpaidInvoicesCount}</div>
        </div>
      </div>

      <!-- Recent Activity Feed -->
      <div class="glass-card" style="margin-top:24px;">
        <h3 style="font-family:'Outfit'; font-size:16px; font-weight:800; margin-bottom:16px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">Recent Activity</h3>
        <div style="display:flex; flex-direction:column;">
          ${activityListHTML}
        </div>
      </div>
    `;
  }

  function getRelativeTime(date) {
    const seconds = Math.floor((new Date() - date) / 1000);
    if (seconds < 5) return 'just now';
    if (seconds < 60) return `${seconds}s ago`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    return `${days}d ago`;
  }

  // VIEW 2: INVITED OPPORTUNITIES (RFQS)
  function renderInvitedRfqs(container, user, vendorRecord) {
    const invited = state.submittedResponses.filter(r =>
      r.hasProcurement && (r.supplierIds || []).includes(vendorRecord.id)
    );

    if (invited.length === 0) {
      container.innerHTML = `
        <div class="glass-card empty-state">
          <div class="empty-state-icon">📧</div>
          <div class="empty-state-title">No Invitations</div>
          <div class="empty-state-desc">You haven't been invited to any RFQs yet.</div>
        </div>
      `;
      return;
    }

    const wrap = document.createElement("div");
    wrap.className = "step-transition-in";
    wrap.innerHTML = `
      <div class="glass-card">
        <!-- Search and Stage Filters -->
        <div style="display:flex; gap:12px; margin-bottom:20px;">
          <input type="text" id="rfq-search-input" class="app-input" style="flex:1.5;" placeholder="Search RFQ name or ID..." oninput="filterInvitedList()" />
          <select id="rfq-stage-select" class="app-input" style="flex:1;" onchange="filterInvitedList()">
            <option value="all">All Stages</option>
            <option value="PENDING SUPPLIER">Pending Supplier</option>
            <option value="EVALUATING">Evaluating Bids</option>
            <option value="COMPLETED">Completed</option>
          </select>
        </div>

        <div style="width:100%; overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse; text-align:left;">
            <thead>
              <tr style="border-bottom:1px solid var(--border-color);">
                <th>RFQ ID</th>
                <th>RFQ/Template Name</th>
                <th>Category</th>
                <th>Stage</th>
                <th>Deadline</th>
                <th style="text-align:right;">Action</th>
              </tr>
            </thead>
            <tbody id="invited-rfq-list-body"></tbody>
          </table>
        </div>
      </div>
    `;
    container.appendChild(wrap);

    // Initial render of the rows
    filterInvitedList();
  }

  function filterInvitedList() {
    const user = getCurrentUser();
    const vendorRecord = getVendorSupplierRecord(user);
    if (!vendorRecord) return;

    const query = (document.getElementById("rfq-search-input")?.value || "").toLowerCase();
    const stageVal = document.getElementById("rfq-stage-select")?.value || "all";
    const tbody = document.getElementById("invited-rfq-list-body");
    if (!tbody) return;

    const invited = state.submittedResponses.filter(r =>
      r.hasProcurement && (r.supplierIds || []).includes(vendorRecord.id)
    );

    const filtered = invited.filter(r => {
      const template = state.templates.find(t => t.id === r.templateId);
      const name = (template ? template.name : r.templateName || "").toLowerCase();
      const id = (r.responseID || "").toLowerCase();

      if (query && !name.includes(query) && !id.includes(query)) return false;
      if (stageVal !== "all" && r.procurementStatus !== stageVal) return false;
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-secondary); padding:20px;">No matching RFQ invitations found.</td></tr>`;
      return;
    }

    tbody.innerHTML = "";
    filtered.forEach(r => {
      const template = state.templates.find(t => t.id === r.templateId);
      const category = template ? (template.category || "—") : "—";
      const deadline = r.deadline || "—";

      let statusStyle = "background:rgba(245, 158, 11, 0.08); color:var(--accent-yellow);";
      let statusText = "Pending Supplier";
      if (r.procurementStatus === "EVALUATING") {
        statusStyle = "background:rgba(118, 0, 230, 0.08); color:#9066ff;";
        statusText = "Evaluating Bids";
      } else if (r.procurementStatus === "COMPLETED") {
        statusStyle = "background:rgba(0, 201, 139, 0.08); color:#00A370;";
        statusText = "Completed";
      }

      // Check if bid exists
      const hasBid = state.applications.some(a => a.rfqId === r.id && a.vendorId === vendorRecord.id);
      let actionBtnHTML = "";

      if (hasBid) {
        actionBtnHTML = `<button class="secondary-btn" style="padding:6px 12px; font-size:12.5px;" onclick="navigateTo('my-bids')">View Bid</button>`;
      } else if (r.procurementStatus === "PENDING SUPPLIER") {
        actionBtnHTML = `<button class="primary-btn" style="padding:6px 12px; font-size:12.5px;" onclick="navigateTo('submit-bid', '${r.id}')">Submit Quote</button>`;
      } else {
        actionBtnHTML = `<button class="secondary-btn" disabled style="padding:6px 12px; font-size:12.5px;">Bidding Closed</button>`;
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${escapeHTML(r.responseID)}</strong></td>
        <td>${escapeHTML(template ? template.name : r.templateName)}</td>
        <td>${escapeHTML(category)}</td>
        <td><span class="status-badge" style="${statusStyle}">${statusText}</span></td>
        <td>${escapeHTML(deadline)}</td>
        <td style="text-align:right;">${actionBtnHTML}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // VIEW 3: COMPILE BID SUBMISSION
  function renderSubmitBid(workspace, user, vendorRecord, rfqId) {
    const rfq = state.submittedResponses.find(r => r.id === rfqId);
    if (!rfq) {
      workspace.innerHTML = `<div class="glass-card"><p style="color:var(--accent-red); text-align:center;">Selected RFQ opportunity could not be found.</p></div>`;
      return;
    }

    const template = state.templates.find(t => t.id === rfq.templateId) || { id: rfq.templateId, name: rfq.templateName, fields: rfq.fields || [] };

    // Guard: already submitted
    const existingBid = state.applications.find(a => a.rfqId === rfqId && a.vendorId === vendorRecord.id);
    if (existingBid) {
      setTimeout(() => {
        showToast("You've already submitted a quote for this RFQ.", "error");
        navigateTo("my-bids");
      }, 50);
      return;
    }

    const formCard = document.createElement("div");
    formCard.className = "glass-card";
    formCard.style.maxWidth = "750px";
    formCard.style.margin = "0 auto";

    let fieldsHTML = "";
    if (template.fields && template.fields.length > 0) {
      fieldsHTML = template.fields.map(field => {
        if (field.id === "field-supplier") {
          return `
            <div style="margin-bottom:18px;">
              <label class="field-label">${escapeHTML(field.label)}</label>
              <input type="text" class="app-input" disabled value="${escapeHTML(vendorRecord.name)}" style="background: rgba(0,0,0,0.03);" data-field-id="${field.id}" />
            </div>
          `;
        }

        let inputHTML = "";
        if (field.type === "short-text") {
          inputHTML = `<input type="text" class="app-input" data-field-id="${field.id}" placeholder="Enter response..." />`;
        } else if (field.type === "long-text") {
          inputHTML = `<textarea class="app-input" data-field-id="${field.id}" style="min-height: 80px; padding:12px; resize: vertical;" placeholder="Provide comments..."></textarea>`;
        } else if (field.type === "number") {
          inputHTML = `
            <div style="display:flex; align-items:center;">
              <input type="number" class="app-input" data-field-id="${field.id}" placeholder="0.00" style="flex:1;" />
            </div>
          `;
        } else if (field.type === "date") {
          inputHTML = `<input type="date" class="app-input" data-field-id="${field.id}" />`;
        } else if (field.type === "checkbox") {
          inputHTML = `
            <div style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="field-${field.id}" data-field-id="${field.id}" style="width:18px; height:18px;" />
              <label for="field-${field.id}" style="font-size:14px; cursor:pointer;">Confirm checkbox terms</label>
            </div>
          `;
        } else if (field.type === "dropdown" || field.type === "select") {
          const optsHTML = (field.options || []).map(o => `<option value="${escapeHTML(o)}">${escapeHTML(o)}</option>`).join("");
          inputHTML = `
            <select class="app-input" data-field-id="${field.id}">
              <option value="">-- Choose option --</option>
              ${optsHTML}
            </select>
          `;
        } else if (field.type === "file") {
          inputHTML = `
            <div class="file-uploader" onclick="document.getElementById('file-${field.id}').click()" style="border: 1px dashed var(--border-color); padding: 16px; border-radius: 8px; text-align: center; cursor: pointer;">
              <span id="label-file-${field.id}" style="font-size:13px; color:var(--text-secondary);">Click to attach document</span>
              <input type="file" id="file-${field.id}" style="display:none;" data-field-id="${field.id}" onchange="document.getElementById('label-file-${field.id}').innerText = 'Selected: ' + this.files[0].name" />
            </div>
          `;
        }

        return `
          <div style="margin-bottom:18px;" class="field-container">
            <label class="field-label">${escapeHTML(field.label)} ${field.required ? '<span style="color:var(--accent-red);">*</span>' : ''}</label>
            ${inputHTML}
            <div class="field-validation-error" id="field-error-${field.id}" style="display:none; color:var(--accent-red); font-size: 11.5px; font-weight:600; margin-top:2px;"></div>
          </div>
        `;
      }).join("");
    }

    formCard.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
        <h2 style="font-family:'Outfit'; font-size:18px; font-weight:800; margin:0;">Bidding: ${escapeHTML(template.name)}</h2>
        <a onclick="navigateTo('invited-rfqs')" style="font-size:13px; font-weight:600; color:var(--accent-purple); cursor:pointer;">&larr; Back to Invited RFQs</a>
      </div>

      <div style="background:rgba(0,0,0,0.01); border:1px solid var(--border-color); border-radius:8px; padding:16px; margin-bottom:24px;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div>
            <span class="field-label">Company Name</span>
            <strong style="font-size:14px;">${escapeHTML(vendorRecord.name)}</strong>
          </div>
          <div>
            <span class="field-label">Contact Person</span>
            <strong style="font-size:14px;">${escapeHTML(vendorRecord.contactPerson)}</strong>
          </div>
        </div>
      </div>

      <form id="bid-submit-form" onsubmit="handleBidSubmission(event, '${rfq.id}')">
        <!-- 2 Standard Fields -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
          <div>
            <label class="field-label">Quote Price ($) <span style="color:var(--accent-red);">*</span></label>
            <div style="display:flex; align-items:center;">
              <span style="font-weight:700; margin-right:8px; font-size:16px; color:var(--text-secondary);">$</span>
              <input type="number" id="bid-price-value" class="app-input" placeholder="0.00" min="0.01" step="0.01" required style="flex:1;" />
            </div>
            <div class="field-validation-error" id="field-error-price" style="display:none; color:var(--accent-red); font-size:11.5px; font-weight:600; margin-top:2px;"></div>
          </div>
          <div>

  function handleBidSubmission(event, rfqId) {
    event.preventDefault();
    const user = getCurrentUser();
    const vendorRecord = getVendorSupplierRecord(user);
    if (!vendorRecord) return;

    const rfq = state.submittedResponses.find(r => r.id === rfqId);
    if (!rfq) return;

    const template = state.templates.find(t => t.id === rfq.templateId) || { id: rfq.templateId, name: rfq.templateName, fields: rfq.fields || [] };

    // Reset validations
    const errors = document.querySelectorAll(".field-validation-error");
    errors.forEach(e => {
      e.style.display = "none";
      e.innerText = "";
    });

    let isValid = true;
    let firstInvalidEl = null;

    // Validate standard Quote Price
    const priceInput = document.getElementById("bid-price-value");
    const priceVal = parseFloat(priceInput.value);
    if (isNaN(priceVal) || priceVal <= 0) {
      const errEl = document.getElementById("field-error-price");
      errEl.innerText = "Quote Price must be greater than $0.00.";
      errEl.style.display = "block";
      isValid = false;
      if (!firstInvalidEl) firstInvalidEl = priceInput;
    }

    // Validate standard Lead Time
    const leadInput = document.getElementById("bid-lead-time");
    const leadVal = parseInt(leadInput.value);
    if (isNaN(leadVal) || leadVal < 0) {
      const errEl = document.getElementById("field-error-lead");
      errEl.innerText = "Estimated Lead Time must be greater than or equal to 0 days.";
      errEl.style.display = "block";
      isValid = false;
      if (!firstInvalidEl) firstInvalidEl = leadInput;
    }

    // Validate dynamic template fields
    const bidDetails = {};
    if (template.fields) {
      for (const field of template.fields) {
        if (field.id === "field-supplier") {
          bidDetails[field.id] = vendorRecord.name;
          continue;
        }

        const inputEl = document.querySelector(`[data-field-id="${field.id}"]`);
        let val = "";
        if (inputEl) {
          if (field.type === "checkbox") {
            val = inputEl.checked;
          } else if (field.type === "file") {
            val = inputEl.files.length > 0 ? inputEl.files[0].name : (inputEl.dataset.savedValue || "");
          } else {
            val = inputEl.value.trim();
          }
        }

        if (field.required && (val === undefined || val === null || val === "" || val === false)) {
          const errEl = document.getElementById(`field-error-${field.id}`);
          if (errEl) {
            errEl.innerText = `${field.label} is required.`;
            errEl.style.display = "block";
          }
          isValid = false;
          if (!firstInvalidEl) firstInvalidEl = inputEl;
        }
        bidDetails[field.id] = val;
      }
    }

    if (!isValid) {
      if (firstInvalidEl) {
        firstInvalidEl.focus();
        firstInvalidEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }

    // Construct application object
    const newApplication = {
      id: `app-${Date.now()}`,
      rfqId: rfq.id,
      rfqTitle: template.name || rfq.templateName,
      vendorId: vendorRecord.id,
      vendorName: vendorRecord.name,
      priority: "normal",
      status: "PENDING",
      date: new Date().toISOString(),
      price: priceVal,
      leadTimeDays: leadVal,
      deliveryStatus: "Processing",
      details: bidDetails
    };

    if (!state.applications) state.applications = [];
    state.applications.push(newApplication);
    saveState();

    // Show success modal overlay
    showSuccessOverlay("Quotation Submitted!", `Your formal proposal for "${template.name}" was successfully validated and securely cataloged.`);
  }

            </div>
          </div>

          <h3 style="font-size: 13px; font-weight: 800; color: var(--accent-purple); text-transform: uppercase; margin-top: 24px; margin-bottom: 12px;">Account Representative</h3>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:18px;">
            <div>
              <label class="field-label">Contact Person *</label>
              <input type="text" id="profile-contact" class="app-input" required value="${escapeHTML(contact)}" />
            </div>
            <div>
              <label class="field-label">Representative Phone *</label>
              <input type="tel" id="profile-phone" class="app-input" required value="${escapeHTML(phone)}" />
            </div>
          </div>

          <h3 style="font-size: 13px; font-weight: 800; color: var(--accent-purple); text-transform: uppercase; margin-top: 24px; margin-bottom: 12px;">Registered Office Address</h3>
          <div style="margin-bottom:18px;">
            <label class="field-label">Street Address *</label>
            <input type="text" id="profile-address" class="app-input" required value="${escapeHTML(address)}" />
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:16px; margin-bottom:18px;">
            <div>
              <label class="field-label">City *</label>
              <input type="text" id="profile-city" class="app-input" required value="${escapeHTML(city)}" />
            </div>
            <div>
              <label class="field-label">State / Province *</label>
              <input type="text" id="profile-state" class="app-input" required value="${escapeHTML(sState)}" />
            </div>
            <div>
              <label class="field-label">Country *</label>
              <input type="text" id="profile-country" class="app-input" required value="${escapeHTML(country)}" />
            </div>
            <div>
              <label class="field-label">ZIP / Postal Code *</label>
              <input type="text" id="profile-zip" class="app-input" required value="${escapeHTML(zip)}" />
            </div>
          </div>

          <h3 style="font-size: 13px; font-weight: 800; color: var(--accent-purple); text-transform: uppercase; margin-top: 24px; margin-bottom: 12px;">Compliance &amp; Finance</h3>
          <div style="margin-bottom:18px;">
            <label class="field-label">Empaneled Certifications (Comma separated)</label>
            <input type="text" id="profile-certs" class="app-input" value="${escapeHTML(certsText)}" placeholder="ISO 9001, REACH Compliant, FDA Registered" />
          </div>
          <div style="display:grid; grid-template-columns: 1fr 1fr 1.2fr; gap:16px; margin-bottom:18px;">
            <div>
              <label class="field-label">Payment Terms (Read-only)</label>
              <input type="text" class="app-input" disabled value="${escapeHTML(vendorRecord ? vendorRecord.paymentTerms : 'Net 30')}" style="background: rgba(0,0,0,0.03);" />
            </div>
            <div>
              <label class="field-label">Settlement Bank Name</label>
              <input type="text" id="profile-bank-name" class="app-input" value="${escapeHTML(bankName)}" />
            </div>
            <div>
              <label class="field-label">Bank Account Number</label>
              <input type="text" id="profile-bank-account" class="app-input" value="${escapeHTML(bankAccount)}" onfocus="clearMaskedBankAccount(this)" />
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; border-top: 1px solid var(--border-color); padding-top: 16px;">
            <button type="button" class="secondary-btn" onclick="navigateTo('vendor-dashboard')">Cancel</button>
            <button type="submit" class="primary-btn">Save Changes</button>
          </div>
        </form>
      </div>
    `;
  }

  function clearMaskedBankAccount(input) {
    if (input.value.startsWith("******")) {
      input.value = "";
    }
  }

  function saveVendorProfile(event) {
    event.preventDefault();
    const user = getCurrentUser();
    let vendorRecord = getVendorSupplierRecord(user);

    const name = document.getElementById("profile-name").value.trim();
    const contact = document.getElementById("profile-contact").value.trim();
    const phone = document.getElementById("profile-phone").value.trim();
    const website = document.getElementById("profile-web").value.trim();
    const gstin = document.getElementById("profile-gstin").value.trim();
    const address = document.getElementById("profile-address").value.trim();
    const city = document.getElementById("profile-city").value.trim();
    const sState = document.getElementById("profile-state").value.trim();
    const country = document.getElementById("profile-country").value.trim();
    const zip = document.getElementById("profile-zip").value.trim();
    const bankName = document.getElementById("profile-bank-name").value.trim();
    const bankAccountRaw = document.getElementById("profile-bank-account").value.trim();

    if (!vendorRecord) {
      // Create new record if unlinked
      vendorRecord = {
        id: `sup-${Date.now()}`,
        linkedUserEmail: user.email.toLowerCase(),
        rating: 5.0,
        pastDealsCount: 0,
        totalBusinessValue: "$0",
        paymentTerms: "Net 30"
      };
      state.suppliers.push(vendorRecord);
    }

    vendorRecord.name = name;
    vendorRecord.contactPerson = contact;
    vendorRecord.phone = phone;
    vendorRecord.website = website;
    vendorRecord.gstin = gstin;
    vendorRecord.addressLine = address;
    vendorRecord.city = city;
    vendorRecord.state = sState;
    vendorRecord.country = country;
    vendorRecord.zip = zip;
    vendorRecord.bankName = bankName;

    // Handle masked bank account input saving
    if (bankAccountRaw && !bankAccountRaw.startsWith("******")) {
      vendorRecord.bankAccount = bankAccountRaw;
      vendorRecord.bankAccountLast4 = bankAccountRaw.slice(-4);
    }

    // Split certifications by comma
    const certsRaw = document.getElementById("profile-certs").value;
    vendorRecord.certifications = certsRaw.split(",").map(c => c.trim()).filter(c => c !== "");

    // Sync to user profile for consistency
    if (user.profile) {
      user.profile.companyName = name;
      user.profile.contactName = contact;
      user.profile.phone = phone;
      user.profile.gstin = gstin;
      user.profile.address = address;
      user.profile.website = website;
    }

    saveState();
    showToast("Profile updated successfully.");
    
    // Re-render immediately
    render();
  }

  // DOC LOAD ATTACHMENTS
  document.addEventListener("DOMContentLoaded", () => {
    loadState();
    
    // Hash change handler
    window.addEventListener("hashchange", handleHashRoute);
    
    // Initial route handler call
    handleHashRoute();
  });
</script>
</body>
</html>
