<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Profile | nexPro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.prod.website-files.com/6974c3dfc9de89aed672a42c/css/fairmarkit26.webflow.shared.4c1cb15cc.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    :root {
      --bg-main: #F3F3F3;
      --bg-card: #FFFFFF;
      --text-primary: #1A1A1A;
      --text-secondary: #7A7A7A;
      --border-color: #D9D9D9;
      --accent-purple: #7600E6;
      --accent-purple-light: #AA63ED;
      --accent-purple-dark: #510A94;
      --accent-green: #00A370;
      --accent-blue: #4700E0;
      --accent-current: var(--accent-purple);
      --accent-current-soft: rgba(118, 0, 230, 0.12);
      --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main) !important;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(118, 0, 230, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 255, 140, 0.05) 0%, transparent 40%) !important;
      color: var(--text-primary);
      min-height: 100vh;
      font-family: "Public Sans", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background graphics */
    .aurora-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      will-change: transform;
      mix-blend-mode: multiply;
    }

    .aurora-blob.b1 {
      width: 620px; height: 620px;
      top: -200px; left: -160px;
      background: radial-gradient(circle, rgba(118, 0, 230, 0.25) 0%, transparent 70%);
      animation: driftA 22s ease-in-out infinite;
    }

    .aurora-blob.b2 {
      width: 560px; height: 560px;
      bottom: -220px; right: -140px;
      background: radial-gradient(circle, rgba(0, 255, 140, 0.22) 0%, transparent 70%);
      animation: driftB 27s ease-in-out infinite;
    }

    @keyframes driftA {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(40px) scale(1.15); }
    }
    @keyframes driftB {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-40px) scale(1.1); }
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    /* Fixed Top Navbar */
    .navbar {
      background-color: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color) !important;
      height: 80px;
      display: flex;
      align-items: center;
    }

    .container.nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand {
      text-decoration: none;
    }

    .nav-links-wrap {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .navlink {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary) !important;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    /* Profile Container */
    .profile-container {
      max-width: 780px;
      margin: 140px auto 60px auto;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    .card-shell {
      position: relative;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
      animation: cardEntrance 0.75s var(--ease-premium) both;
      overflow: hidden;
    }

    @keyframes cardEntrance {
      0% { opacity: 0; transform: translateY(40px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Hero Banner Area */
    .hero-banner {
      height: 140px;
      background: var(--accent-current);
      position: relative;
      transition: background-color 0.4s ease;
    }

    .identity-section {
      padding: 0 48px 24px 48px;
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 24px;
      margin-top: -64px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .avatar-wrapper {
      position: relative;
      z-index: 5;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 4px solid var(--bg-card);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      font-weight: 800;
      color: var(--accent-current);
      transition: color 0.4s ease;
    }

    .identity-text {
      flex: 1;
      padding-bottom: 8px;
      min-width: 200px;
    }

    .display-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .display-email {
      font-size: 14.5px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .role-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: var(--accent-current-soft);
      color: var(--accent-current);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .header-actions {
      padding-bottom: 8px;
    }

    .btn-sm {
      height: 38px;
      padding: 0 20px;
      border-radius: 8px;
      font-size: 13.5px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.03);
      border-color: var(--text-primary);
    }

    .settings-section {
      display: none;
      animation: fadeInUp 0.45s var(--ease-premium) both;
    }

    .settings-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-primary);
      margin: 28px 0 16px 0;
      letter-spacing: 0.8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      text-transform: uppercase;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .settings-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .settings-row.full-width {
      grid-column: span 2;
    }

    .settings-checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      user-select: none;
    }

    .settings-checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      accent-color: var(--accent-current);
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .identity-section {
        padding: 0 24px 20px 24px;
        justify-content: center;
        text-align: center;
      }
      .avatar {
        width: 90px; height: 90px;
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- Premium Background -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <div class="aurora-layer" aria-hidden="true">
    <div class="aurora-blob b1"></div>
    <div class="aurora-blob b2"></div>
  </div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- Shared Top Navbar (Dynamically updated by auth.js) -->
  <div class="navbar-div">
    <div role="banner" class="navbar w-nav">
      <div class="container nav">
        <a href="index.html" class="brand">
          <div class="logo w-embed" style="display:flex; align-items:center;">
            <svg width="150" height="40" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg">
              <text x="10" y="55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Public Sans', sans-serif" font-weight="900" font-size="56px" fill="#1A1A1A" letter-spacing="-2px">
                nex<tspan fill="#00A370">Pro</tspan>
              </text>
            </svg>
          </div>
        </a>
        <div class="nav-links-wrap" id="nav-links">
          <a href="generate-rfq.html" class="navlink is-login">Workspace</a>
        </div>
      </div>
    </div>
  </div>

  <div class="profile-container">
    <div class="card-shell" id="card-shell">
      <div class="np-profile-card">
        <!-- Colored Hero Banner -->
        <div class="hero-banner" id="hero-banner"></div>

        <!-- Identity Section -->
        <div class="identity-section">
          <div class="avatar-wrapper">
            <div class="avatar" id="avatar-initials">JD</div>
          </div>
          <div class="identity-text">
            <h1 class="display-name" id="display-name">Jane Doe</h1>
            <div class="display-email" id="display-email">jane.doe@nexpro.com</div>
            <span class="role-badge" id="role-badge">Buyer</span>
          </div>
          <div class="header-actions">
            <button class="np-btn np-btn-outline btn-sm" id="edit-btn" onclick="toggleEditMode()">Edit Profile</button>
          </div>
        </div>

        <!-- Stats Chips Row -->
        <div class="np-stat-chip-row" id="stats-row">
          <!-- Loaded dynamically -->
        </div>

        <!-- Tabs Switcher (Tab 1, Tab 2, Tab 3) -->
        <div class="np-ptab" id="profile-tabs">
          <button class="np-ptab-btn active" data-tab="details" onclick="switchProfileTab('details')">My Details</button>
          <button class="np-ptab-btn" id="second-tab-btn" data-tab="role-tab" onclick="switchProfileTab('role-tab')">Sourcing Preferences</button>
          <button class="np-ptab-btn" data-tab="security" onclick="switchProfileTab('security')">Security & Preferences</button>
        </div>

        <!-- Details Grid wrapper -->
        <div class="np-details-wrapper" id="details-section-wrapper">
          <form id="profile-form" onsubmit="saveProfileChanges(event)">
            <div class="np-edit-grid" id="details-grid">
              <!-- Dynamically populated per user role and tab -->
            </div>

            <!-- Action buttons visible in Edit mode -->
            <div class="np-edit-actions" id="edit-actions" style="display: none;">
              <button type="button" class="np-btn np-btn-outline btn-sm" onclick="cancelEditMode()">Cancel</button>
              <button type="submit" class="np-btn np-btn-dark btn-sm" id="save-btn">
                <span class="np-spin" aria-hidden="true"></span>
                <span class="np-btn-label">Save Changes</span>
              </button>
            </div>
          </form>
        </div>

        <!-- Security & Preferences Tab Section -->
        <div class="np-details-wrapper settings-section" id="security-section">
          <!-- Change Password Form -->
          <div class="settings-title">Change Password</div>
          <form id="settings-password-form" onsubmit="handlePasswordChange(event)">
            <div class="settings-grid">
              <div class="settings-row full-width">
                <label for="old-password">Current Password</label>
                <input type="password" id="old-password" class="np-field" required placeholder="••••••••" style="max-width: 320px;" />
              </div>
              <div class="settings-row">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" class="np-field" required placeholder="••••••••" />
              </div>
              <div class="settings-row">
                <label for="confirm-new-password">Confirm New Password</label>
                <input type="password" id="confirm-new-password" class="np-field" required placeholder="••••••••" />
              </div>
              <div class="settings-row full-width" style="margin-top: 10px;">
                <button type="submit" class="np-btn np-btn-dark btn-sm" id="change-pass-btn" style="max-width: 180px;">Update Password</button>
              </div>
            </div>
          </form>

          <!-- Preferences -->
          <div class="settings-title">App Preferences</div>
          <div class="settings-grid">
            <div class="settings-row">
              <label for="theme-pref">Color Theme</label>
              <select id="theme-pref" class="np-field" onchange="handleThemePreferenceChange(this.value)">
                <option value="light">Light Theme (Default)</option>
                <option value="dark">Dark Theme</option>
              </select>
            </div>
            <div class="settings-row full-width" style="margin-top: 10px;">
              <div class="settings-checkbox-row">
                <input type="checkbox" id="email-notif-pref" checked onchange="savePreferences()" />
                <label for="email-notif-pref" class="terms-label" style="text-transform: none; letter-spacing: 0; font-size: 13.5px; font-weight: 500;">Receive email alerts for RFQ matches and updates</label>
              </div>
              <div class="settings-checkbox-row">
                <input type="checkbox" id="sys-notif-pref" checked onchange="savePreferences()" />
                <label for="sys-notif-pref" class="terms-label" style="text-transform: none; letter-spacing: 0; font-size: 13.5px; font-weight: 500;">Enable in-app notification indicators</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Back to Workspace Nav -->
    <a href="generate-rfq.html" class="np-link-arrow" id="back-link">← Back to Workspace</a>
  </div>

  <div id="toast" class="np-toast-notif"></div>

  <script src="state.js"></script>
  <script src="auth.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let isEditMode = false;
    let currentUser = null;
    let currentTab = 'details';
    let editBackup = {};

    const roleAccents = {
      buyer: { color: '#7600E6', soft: 'rgba(118, 0, 230, 0.12)', label: 'Buyer' },
      vendor: { color: '#00A370', soft: 'rgba(63, 122, 84, 0.12)', label: 'Vendor' }
    };

    function getInitials(name, email) {
      if (name && name.trim()) {
        const parts = name.trim().split(/\s+/);
        if (parts.length >= 2) {
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }
        return name.trim().substring(0, 2).toUpperCase();
      }
      if (email) {
        return email.substring(0, 2).toUpperCase();
      }
      return "NP";
    }

    function loadProfile() {
      currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }

      // Read role from local storage (default to 'buyer' if unset)
      const role = getNexproRole();
      const accent = roleAccents[role] || roleAccents.buyer;
      document.documentElement.style.setProperty('--accent-current', accent.color);
      document.documentElement.style.setProperty('--accent-current-soft', accent.soft);
      
      const saveBtn = document.getElementById('save-btn');
      if (saveBtn) saveBtn.className = `np-btn np-btn-dark btn-sm`;

      document.getElementById('display-email').innerText = currentUser.email;
      const badge = document.getElementById('role-badge');
      badge.innerText = accent.label;
      badge.className = `role-badge ${role}`;

      const profile = currentUser.profile || {};
      let name = "";
      if (role === 'buyer') {
        name = profile.fullName || "Jane Doe";
      } else {
        name = profile.companyName || "Acme Supplier Inc";
      }

      document.getElementById('display-name').innerText = name;
      document.getElementById('avatar-initials').innerText = getInitials(name, currentUser.email);

      // Back Link
      const backLink = document.getElementById('back-link');
      backLink.href = 'generate-rfq.html';
      backLink.className = 'np-link-arrow';
      backLink.innerText = '← Back to Workspace';

      // Update Tab 2 name
      const secondTab = document.getElementById('second-tab-btn');
      if (role === 'buyer') {
        secondTab.innerText = 'Sourcing Preferences';
      } else {
        secondTab.innerText = 'Business & Payment Info';
      }

      renderStatsRow(role);
      renderDetailsGrid();
    }

    function renderStatsRow(role) {
      const statsRow = document.getElementById('stats-row');
      statsRow.innerHTML = "";
      
      if (role === 'buyer') {
        statsRow.innerHTML = `
          <div class="np-stat-chip">
            <span class="np-stat-label">RFQs Posted</span>
            <span class="np-stat-val">14</span>
          </div>
          <div class="np-stat-chip">
            <span class="np-stat-label">Active Suppliers</span>
            <span class="np-stat-val">8</span>
          </div>
          <div class="np-stat-chip">
            <span class="np-stat-label">Total Spend</span>
            <span class="np-stat-val">$420K</span>
          </div>
        `;
      } else {
        statsRow.innerHTML = `
          <div class="np-stat-chip">
            <span class="np-stat-label">Bids Submitted</span>
            <span class="np-stat-val">29</span>
          </div>
          <div class="np-stat-chip">
            <span class="np-stat-label">Win Rate</span>
            <span class="np-stat-val">38%</span>
          </div>
          <div class="np-stat-chip">
            <span class="np-stat-label">Active Contracts</span>
            <span class="np-stat-val">5</span>
          </div>
        `;
      }
    }

    function renderDetailsGrid() {
      const grid = document.getElementById('details-grid');
      grid.innerHTML = "";
      const profile = currentUser.profile || {};
      const role = getNexproRole();

      if (currentTab === 'details') {
        if (role === 'buyer') {
          grid.innerHTML = `
            ${renderField('Full Name', 'fullName', profile.fullName || '', 'b-name', true)}
            ${renderField('Designation / Job Title', 'designation', profile.designation || '', 'b-title', true)}
            ${renderField('Company Name', 'companyName', profile.companyName || '', 'b-company', true)}
            ${renderField('Department', 'department', profile.department || '', 'b-dept', true)}
            ${renderField('Phone Number', 'phone', profile.phone || '', 'b-phone', true)}
          `;
        } else {
          grid.innerHTML = `
            ${renderField('Full Name', 'fullName', profile.fullName || '', 'v-contact', true)}
            ${renderField('Business Name', 'companyName', profile.companyName || '', 'v-company', true)}
            ${renderField('GST / Tax ID', 'gstin', profile.gstin || '', 'v-gst', true)}
            ${renderField('Industry Category', 'category', profile.category || '', 'v-category', true)}
            ${renderField('Phone Number', 'phone', profile.phone || '', 'v-phone', true)}
          `;
        }
      } else if (currentTab === 'role-tab') {
        if (role === 'buyer') {
          grid.innerHTML = `
            ${renderField('City', 'city', profile.city || '', 'b-city', true)}
            ${renderField('Country', 'country', profile.country || '', 'b-country', true)}
            ${renderField('Business Address', 'address', profile.address || '', 'b-address', true, true)}
          `;
        } else {
          grid.innerHTML = `
            ${renderField('Warehouse Location', 'warehouseLocation', profile.warehouseLocation || '', 'v-warehouse', true)}
            ${renderField('Country', 'country', profile.country || '', 'v-country', true)}
            ${renderField('Bank / Payment Details', 'paymentDetails', profile.paymentDetails || '', 'v-payment', true, true)}
          `;
        }
      }
    }

    function renderField(label, key, val, id, isRequired, isFullWidth = false) {
      const fullWidthClass = isFullWidth ? 'full-width' : '';
      if (isEditMode) {
        const reqAttr = isRequired ? 'required' : '';
        return `
          <div class="np-field-row ${fullWidthClass}">
            <label for="${id}">${label}</label>
            <input type="text" id="${id}" data-key="${key}" class="np-field" value="${escapeHTML(val)}" ${reqAttr} />
          </div>
        `;
      } else {
        return `
          <div class="np-info-row ${fullWidthClass}">
            <label>${label}</label>
            <span class="np-value">${escapeHTML(val) || '—'}</span>
          </div>
        `;
      }
    }

    function escapeHTML(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function toggleEditMode() {
      // Create clean deep copy back up of the fields in currentUser state
      const profile = currentUser.profile || {};
      editBackup = JSON.parse(JSON.stringify(profile));

      document.getElementById('edit-btn').style.display = 'none';
      document.getElementById('edit-actions').style.display = 'flex';

      const grid = document.getElementById('details-grid');
      grid.style.opacity = 0;
      grid.style.transform = 'translateY(8px)';
      
      setTimeout(() => {
        isEditMode = true;
        renderDetailsGrid();
        grid.offsetHeight;
        grid.style.opacity = 1;
        grid.style.transform = 'translateY(0)';
      }, 190);
    }

    function cancelEditMode() {
      // Revert edit backup to global state in memory
      currentUser.profile = JSON.parse(JSON.stringify(editBackup));

      document.getElementById('edit-btn').style.display = 'block';
      document.getElementById('edit-actions').style.display = 'none';

      const grid = document.getElementById('details-grid');
      grid.style.opacity = 0;
      grid.style.transform = 'translateY(-8px)';
      
      setTimeout(() => {
        isEditMode = false;
        renderDetailsGrid();
        grid.offsetHeight;
        grid.style.opacity = 1;
        grid.style.transform = 'translateY(0)';
      }, 190);
    }

    function saveProfileChanges(e) {
      e.preventDefault();
      
      const saveBtn = document.getElementById('save-btn');
      saveBtn.classList.add('np-loading');

      const profile = currentUser.profile || {};
      const inputs = document.querySelectorAll('#profile-form input');
      
      inputs.forEach(input => {
        const key = input.getAttribute('data-key');
        if (key) {
          profile[key] = input.value.trim();
        }
      });

      // Update mock db user
      const userIndex = window.appState.users.findIndex(u => u.email.toLowerCase() === currentUser.email.toLowerCase() && u.role === currentUser.role);
      if (userIndex !== -1) {
        window.appState.users[userIndex].profile = profile;
        currentUser.profile = profile;
        
        setCurrentUser(currentUser);
        saveGlobalState();
      }

      setTimeout(() => {
        saveBtn.classList.remove('np-loading');
        
        document.getElementById('edit-btn').style.display = 'block';
        document.getElementById('edit-actions').style.display = 'none';
        
        const grid = document.getElementById('details-grid');
        grid.style.opacity = 0;
        grid.style.transform = 'translateY(-8px)';
        
        setTimeout(() => {
          isEditMode = false;
          loadProfile();
          grid.offsetHeight;
          grid.style.opacity = 1;
          grid.style.transform = 'translateY(0)';
          showToast("Profile updated successfully");
        }, 190);
      }, 600);
    }

    function switchProfileTab(tab) {
      currentTab = tab;
      
      document.querySelectorAll('#profile-tabs .np-ptab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.querySelector(`#profile-tabs .np-ptab-btn[data-tab="${tab}"]`);
      if (activeBtn) activeBtn.classList.add('active');

      const detailsSection = document.getElementById('details-section-wrapper');
      const securitySection = document.getElementById('security-section');
      const editBtn = document.getElementById('edit-btn');

      if (tab === 'details' || tab === 'role-tab') {
        detailsSection.style.display = 'block';
        securitySection.style.display = 'none';
        editBtn.style.display = isEditMode ? 'none' : 'block';

        const grid = document.getElementById('details-grid');
        grid.style.opacity = 0;
        setTimeout(() => {
          renderDetailsGrid();
          grid.offsetHeight;
          grid.style.opacity = 1;
        }, 150);
      } else {
        detailsSection.style.display = 'none';
        securitySection.style.display = 'block';
        editBtn.style.display = 'none';
        if (isEditMode) cancelEditMode();
      }
    }

    function handlePasswordChange(e) {
      e.preventDefault();

      const oldPass = document.getElementById('old-password').value;
      const newPass = document.getElementById('new-password').value;
      const confirmNewPass = document.getElementById('confirm-new-password').value;

      if (currentUser.password !== oldPass) {
        showToast("Current password does not match.");
        return;
      }
      if (newPass !== confirmNewPass) {
        showToast("New passwords do not match.");
        return;
      }
      if (newPass.length < 6) {
        showToast("New password must be at least 6 characters.");
        return;
      }

      // Update password inside users array and state
      const userIndex = window.appState.users.findIndex(u => u.email.toLowerCase() === currentUser.email.toLowerCase() && u.role === currentUser.role);
      if (userIndex !== -1) {
        window.appState.users[userIndex].password = newPass;
        currentUser.password = newPass;

        setCurrentUser(currentUser);
        saveGlobalState();

        document.getElementById('settings-password-form').reset();
        showToast("Password updated successfully");
      }
    }

    function handleThemePreferenceChange(value) {
      if (value === 'dark') {
        document.body.classList.add('dark-theme-override');
        if (!document.getElementById('dark-theme-styles')) {
          const styles = document.createElement('style');
          styles.id = 'dark-theme-styles';
          styles.innerHTML = `
            body.dark-theme-override {
              background-color: #121212 !important;
              color: #E5E5E5 !important;
            }
            body.dark-theme-override .np-profile-card {
              background: rgba(26, 26, 26, 0.85) !important;
              border-color: rgba(255, 255, 255, 0.1) !important;
            }
            body.dark-theme-override .display-name,
            body.dark-theme-override .np-value,
            body.dark-theme-override label,
            body.dark-theme-override .settings-title {
              color: #E5E5E5 !important;
            }
            body.dark-theme-override .np-field {
              background: rgba(40, 40, 40, 0.95) !important;
              color: #E5E5E5 !important;
              border-color: rgba(255, 255, 255, 0.15) !important;
            }
            body.dark-theme-override .np-stat-chip {
              background: #252525 !important;
              border-color: #333 !important;
            }
            body.dark-theme-override .np-stat-val {
              color: #FFF !important;
            }
          `;
          document.head.appendChild(styles);
        }
      } else {
        document.body.classList.remove('dark-theme-override');
      }
      savePreferences();
    }

    function savePreferences() {
      const theme = document.getElementById('theme-pref').value;
      const emailNotifications = document.getElementById('email-notif-pref').checked;
      const systemNotifications = document.getElementById('sys-notif-pref').checked;

      currentUser.preferences = {
        theme,
        emailNotifications,
        systemNotifications
      };

      const userIndex = window.appState.users.findIndex(u => u.email.toLowerCase() === currentUser.email.toLowerCase() && u.role === currentUser.role);
      if (userIndex !== -1) {
        window.appState.users[userIndex].preferences = currentUser.preferences;
        setCurrentUser(currentUser);
        saveGlobalState();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();

      const prefs = currentUser.preferences || {};
      if (prefs.theme) {
        document.getElementById('theme-pref').value = prefs.theme;
        handleThemePreferenceChange(prefs.theme);
      }
      document.getElementById('email-notif-pref').checked = (prefs.emailNotifications !== false);
      document.getElementById('sys-notif-pref').checked = (prefs.systemNotifications !== false);

      const params = new URLSearchParams(window.location.search);
      if (params.get('prompt_edit') === 'true') {
        toggleEditMode();
        setTimeout(() => {
          showToast("Please complete your profile details to proceed.");
        }, 400);
      }
    });

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Starfield canvas particles
    (function initParticles() {
      const canvas = document.getElementById('particles-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h, particles;
      let mouseX = 0, mouseY = 0;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        const count = Math.min(110, Math.floor((w * h) / 14000));
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.6 + 0.4,
          baseAlpha: Math.random() * 0.5 + 0.2,
          twinkleSpeed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2,
          depth: Math.random() * 0.6 + 0.2
        }));
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          const alpha = p.baseAlpha * (0.6 + 0.4 * Math.sin(t * p.twinkleSpeed + p.phase));
          const offsetX = (mouseX - w / 2) * p.depth * 0.02;
          const offsetY = (mouseY - h / 2) * p.depth * 0.02;
          ctx.beginPath();
          ctx.arc(p.x + offsetX, p.y + offsetY, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(118, 0, 230, ${alpha * 0.6})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      resize();
      if (!prefersReducedMotion) {
        requestAnimationFrame(draw);
      } else {
        draw(0);
      }
    })();
  </script>
</body>
</html>
